version: 2
updates:
  # One root lockfile covers every workspace package, and the Bun catalog
  # lives in the root package.json, so this job must stay at "/".
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Skip versions younger than 7 days (matches bunfig.toml
    # minimumReleaseAge). Security updates ignore this.
    cooldown:
      default-days: 7
    # Each open PR otherwise re-runs CI on every push to main.
    # Comment "@dependabot rebase" to rebase one by hand.
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    # Every entry says why it exists and when to delete it. Re-check these
    # whenever a Dependabot PR bumps the blocking package.
    ignore:
      # WHY: @convex-dev/better-auth 0.12.x peers on better-auth <1.7.0, and
      # better-auth 1.7 removed the oidc-provider plugin the adapter imports.
      # A newer better-auth installs a second copy and fails Convex bundling.
      # The 1.7-only advisories (GHSA-965c, r4xp, q84f, 44jh) were dismissed
      # as not applicable: no social/OAuth login, OAuth proxy, device login
      # or Drizzle adapter.
      # REMOVE WHEN: @convex-dev/better-auth 0.13 ships
      # (convex/better-auth#457). Upgrade both packages together and run the
      # adapter's schema migration.
      - dependency-name: "better-auth"
        versions: [">=1.7.0"]
      # WHY: typescript-eslint (type-aware rules in our ESLint config) peers on
      # typescript <6.1.0. TypeScript 7 ships without the JS compiler API it
      # needs (typescript-eslint/typescript-eslint#12518, closed not planned).
      # REMOVE WHEN: a typescript-eslint release accepts typescript 7
      # (tracked in typescript-eslint/typescript-eslint#10940, waits on the
      # TS 7.1 API).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # WHY: @tanstack/solid-hotkeys 0.14 made `Hotkey` a chord-or-sequence
      # union across every API. Those types blow up tsc: the design-system
      # typecheck went from ~10s on 0.13 to over 4 minutes, and CI cancelled
      # the job (seen on #234). 0.14+ also binds an undefined `target` to
      # `document`; SheetNav and PersonDetail would need `?? null`.
      # REMOVE WHEN: a solid-hotkeys release typechecks the design system in
      # normal time. Test: bump it, run `bun run typecheck` in
      # packages/design-system, compare with ~10s.
      - dependency-name: "@tanstack/solid-hotkeys"
        versions: [">=0.14.0"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      majors:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
