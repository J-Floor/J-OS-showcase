name: Tests

on:
  workflow_dispatch:
  # Only main — `pull_request` already covers a branch with an open PR, and
  # listening to both ran the suite twice for every commit.
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.scss"
      - "**.json"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.html"
      - "**.pdf"
      - "**.png"
      - "bun.lock"
      - "bunfig.toml"
      - "**/bunfig.toml"
      - "turbo.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.scss"
      - "**.json"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.html"
      - "**.pdf"
      - "**.png"
      - "bun.lock"
      - "bunfig.toml"
      - "**/bunfig.toml"
      - "turbo.json"
      - ".github/workflows/tests.yml"

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# `--affected` diffs against the PR's base branch. turbo reads it from
# GITHUB_BASE_REF (`main`) and resolves it as a local ref, which the checkout
# does not have (only `origin/main`), so it fell back to "all files changed"
# and ran every package on every PR. Point it at the remote-tracking ref.
env:
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

permissions:
  contents: read

jobs:
  test:
    name: Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel the others and hide their failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install

      # Turborepo remote cache backed by the GitHub Actions cache: one cache
      # shared by every job, workflow and branch, keyed by turbo's task hash.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          # A fixed port fails the job when the runner already holds it (EADDRINUSE).
          server-port: 0

      # The agent-guard tests take under a second; one shard is enough.
      - name: Agent-guard tests
        if: matrix.shard == 1
        run: bun test scripts

      - name: Run tests
        run: bunx --bun turbo run test${{ github.event_name == 'pull_request' && ' --affected' || '' }} --continue -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
