name: PR title

# PR titles follow Conventional Commits. Main only takes squash merges, so the
# title becomes the commit subject on main.
# See docs/superpowers/specs/2026-11-19-pr-title-check-design.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check the PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            infra
          requireScope: false
