name: Deploy staging

# Deploys any branch, tag or SHA to https://staging.thejfloor.com, backed by the
# production deployment of the separate Convex project j-os-staging. Only this
# workflow deploys to it; personal dev deployments are never touched.
#   gh workflow run deploy-staging.yml -f ref=<branch>
#   gh run watch "$(gh run list --workflow deploy-staging.yml -L 1 --json databaseId -q '.[0].databaseId')"
run-name: Staging ← ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: true
        default: main
      backend:
        description: "Also deploy the ref's Convex functions to the staging backend (off: frontend only, for older refs)"
        type: boolean
        default: true

# One staging slot: a newer run replaces an older one.
concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Convex staging backend and staging web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_URL: https://staging.thejfloor.com
    steps:
      # Tooling (the shared actions) comes from this workflow's own commit, the
      # app from the requested ref, so a branch cut before the actions existed
      # still deploys.
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          working-directory: target

      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          server-port: 0

      # Same as prod's deploy step, against the staging backend: its functions
      # become the ref's. The staging site URL is the cloud URL's .convex.site
      # twin. The staging backend's SITE_URL is the staging origin, so sign-in
      # works for any ref.
      - name: Deploy Convex staging backend (unless frontend only) and build SPA
        working-directory: target/apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }}
          # Staging shares the dev reCAPTCHA site key, which lists the staging domain.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY_DEV }}
          # Public key, kept as a repo variable: a deploy key may deploy but
          # not read the environment. Must match staging's VAPID_PUBLIC_KEY.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY_STAGING }}
          BACKEND: ${{ inputs.backend }}
          # The staging backend's public URL, for frontend-only runs that leave
          # its functions untouched.
          STAGING_CONVEX_URL: ${{ vars.CONVEX_URL_STAGING }}
        run: |
          if [ "$BACKEND" = "true" ]; then
            bunx --bun convex deploy -y \
              --cmd-url-env-var-name VITE_CONVEX_URL \
              --cmd 'VITE_CONVEX_SITE_URL="${VITE_CONVEX_URL%.convex.cloud}.convex.site" bunx --bun turbo build --filter=@j-os/web'
          else
            test -n "$STAGING_CONVEX_URL"
            echo "::notice::Frontend only: the staging backend keeps its current functions; this ref's UI may call functions it does not have."
            VITE_CONVEX_URL="$STAGING_CONVEX_URL" \
              VITE_CONVEX_SITE_URL="${STAGING_CONVEX_URL%.convex.cloud}.convex.site" \
              bunx --bun turbo build --filter=@j-os/web
          fi

      # Tells the installed staging app apart from the real one on a phone,
      # for any ref (the manifest is rewritten after the build).
      - name: Name the app as staging
        run: |
          manifest=target/apps/web/dist/manifest.webmanifest
          jq '.name = "J floor staging" | .short_name = "J staging"' "$manifest" > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" "$manifest"

      # Builds from before the chunk import map (#226) have no inline map and
      # need no hash; the CSP's file placeholder is then simply empty.
      - name: Detect import map
        id: importmap
        run: |
          if grep -q '<script type="importmap">' target/apps/web/dist/index.html; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This ref has no inline import map; skipping its hash check."
          fi

      - name: Check import map hash
        if: steps.importmap.outputs.present == 'true'
        uses: ./.github/actions/check-importmap-csp
        with:
          dist: target/apps/web/dist

      - name: Record the deployed ref
        id: deployed
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git -C target rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s %s\n' "$REF" "$sha" > target/apps/web/dist/staging-ref.txt

      # The staging key is locked (rrsync, write-only) to the staging dist dir;
      # it cannot reach the prod app or the playground.
      - name: Ship SPA build to staging
        uses: ./.github/actions/ship-dist
        with:
          source: target/apps/web/dist
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY_STAGING }}
          key-name: staging_key
          host: ${{ secrets.DEPLOY_HOST }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Summary
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ steps.deployed.outputs.sha }}
          BACKEND: ${{ inputs.backend }}
        run: |
          {
            echo "### Staging deployed"
            echo ""
            echo "- URL: $STAGING_URL"
            echo "- Ref: \`$REF\` (\`$SHA\`)"
            if [ "$BACKEND" = "true" ]; then
              echo "- Backend: Convex j-os-staging (its functions now come from this ref)"
            else
              echo "- Backend: Convex j-os-staging, functions unchanged (frontend only)"
            fi
            echo "- Deployed ref file: $STAGING_URL/staging-ref.txt (fetch it; a navigation gets the app shell)"
          } >> "$GITHUB_STEP_SUMMARY"
