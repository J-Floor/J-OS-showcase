name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the gate and clone, but do not push"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  mirror:
    # Only `main` is ever published, also on a manual run. Until the
    # MIRROR_ENABLED repository variable is "true" the job is skipped.
    if: github.ref == 'refs/heads/main' && vars.MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      # A short-lived token from the org-owned "J-OS mirror" GitHub App,
      # installed on J-OS-showcase only (not tied to any person's account).
      # The private key reaches only this official action, pinned by SHA.
      - name: Create showcase token
        id: showcase-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: J-Floor
          repositories: J-OS-showcase
          permission-contents: write
          permission-administration: read
          # Pushing .github/workflows/* needs it; Actions is off on the
          # showcase, so the copied workflows never run there.
          permission-workflows: write

      # The denylist and the token reach this step only.
      - name: Mirror
        env:
          MIRROR_DENYLIST: ${{ secrets.MIRROR_DENYLIST }}
          MIRROR_TOKEN: ${{ steps.showcase-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "$MIRROR_DENYLIST" ] || [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_ENABLED is true but MIRROR_DENYLIST is empty or no showcase token was issued."
            exit 1
          fi
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--dry-run"; fi
          bun scripts/mirror/run.ts --ref HEAD $flags
