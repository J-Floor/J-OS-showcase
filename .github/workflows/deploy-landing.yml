name: Deploy landing page

# thejfloor.com: the static landing-page SPA, served by Cloudflare Pages
# (project jfloor-landing). Runs only when the page or what it builds from
# changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing-page/**"
      - "packages/design-system/**"
      - "bun.lock"
      - ".github/workflows/deploy-landing.yml"

# Never run two production deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Landing page to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install

      # Turborepo remote cache backed by the GitHub Actions cache: one cache
      # shared by every job, workflow and branch, keyed by turbo's task hash.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          # A fixed port fails the job when the runner already holds it (EADDRINUSE).
          server-port: 0

      - name: Build landing page
        run: bunx --bun turbo build --filter=@j-os/landing-page

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx --bun wrangler pages deploy apps/landing-page/dist
          --project-name jfloor-landing
          --branch main
          --commit-hash "${{ github.sha }}"
