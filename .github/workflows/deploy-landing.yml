name: Deploy landing page

# thejfloor.com: the static landing-page SPA, served by Cloudflare Pages
# (project jfloor-landing). Runs only when the page or what it builds from
# changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing-page/**"
      - "packages/design-system/**"
      - "bun.lock"
      - ".github/workflows/deploy-landing.yml"

# Never run two production deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Landing page to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Cache Bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turborepo remote cache backed by the GitHub Actions cache: one cache
      # shared by every job, workflow and branch, keyed by turbo's task hash.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          # A fixed port fails the job when the runner already holds it (EADDRINUSE).
          server-port: 0

      - name: Build landing page
        run: bunx --bun turbo build --filter=@j-os/landing-page

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx --bun wrangler pages deploy apps/landing-page/dist
          --project-name jfloor-landing
          --branch main
          --commit-hash "${{ github.sha }}"
