# Sets up Bun and installs the workspace, restoring the installed node_modules
# trees from the Actions cache on an exact key. There are no restore-keys: a
# near match would be a stale tree. bun install always runs; on a hit it is a
# no-op (about 50 ms, no network) that still fails on a lockfile out of step
# with a package.json. The trees are saved straight after install, before any
# build or test writes into them.
name: "Install dependencies"
description: "Sets up Bun and runs bun install --frozen-lockfile, with node_modules cached on an exact key."

inputs:
  working-directory:
    description: "Workspace root to install, relative to the job workspace."
    default: "."

outputs:
  cache-hit:
    description: "true when node_modules came from the cache."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.working-directory }}/package.json

    # Everything that changes the install: the lockfile, every workspace
    # manifest, every bunfig.toml and any patches. sha256sum prints the file
    # names, so a moved file changes the hash too.
    - name: Hash install inputs
      id: inputs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(bun.lock package.json bunfig.toml apps/*/package.json apps/*/bunfig.toml packages/*/package.json packages/*/bunfig.toml)
        while IFS= read -r -d '' patch; do files+=("$patch"); done < <(find patches -type f -print0 2>/dev/null | sort -z)
        echo "hash=$(sha256sum "${files[@]}" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Restore node_modules
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.working-directory }}/node_modules
          ${{ inputs.working-directory }}/apps/*/node_modules
          ${{ inputs.working-directory }}/packages/*/node_modules
        key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-bun${{ steps.bun.outputs.bun-version }}-${{ steps.inputs.outputs.hash }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile

    - name: Save node_modules
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.working-directory }}/node_modules
          ${{ inputs.working-directory }}/apps/*/node_modules
          ${{ inputs.working-directory }}/packages/*/node_modules
        key: ${{ steps.restore.outputs.cache-primary-key }}
